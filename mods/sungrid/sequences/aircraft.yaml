# First-pass custom art (docs/BACKLOG.md issue #34) replacing the borrowed
# tran/mh60 rotor-craft bodies with dedicated small-drone silhouettes -- see
# gen_concept_art.py.
#
# No `rotor:`/`slow-rotor:` sequences: these used to point at the shared generic
# lrotor/rrotor/yrotorlg.shp discs, mounted as WithIdleOverlay on top of the
# four rotors each drone's own sprite already bakes. Those stock discs are
# 32-37px wide -- Chinook/Black Hawk scale -- and once the airframes were shrunk
# to ~15px they were wider than the drone carrying them, so both the overlays
# and these sequences are gone (see rules/aircraft.yaml).
sgdro:
	idle:
		Filename: sgdro.png
		Facings: 32
		UseClassicFacings: True
	icon:
		Filename: sgdroicon.png

