	# Grid Reserve participation. Without this the only thing that ever builds a bot a Vault is the
	# base builder's storage-overflow path (SiloTypes above), which triggers on full ore storage and
	# has nothing to do with the Reserve target - so a bot tops out one or two Vaults short of it and
	# the economic victory is effectively human-only. Every instance below no-ops entirely while the
	# gridreserve lobby checkbox is off. See docs/GAME_MODES.md.
	GridReserveBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai
		VaultTypes: silo
		# Consumed by each SquadManagerBotModule's PreferredTargetCondition above. This hook has
		# existed unused since issue #67 built it for exactly this; the engine side that could read
		# it did not exist until now.
		EnemyBankingCondition: enemy-banking
	# Coverage is spare *capacity* only, now that GridReserveVaultInfo.MaximumTargetPercent caps what is
	# actually banked at the Reserve target - before that ceiling existed these percentages were banked
	# in full, which bought a Lockdown no single raid could break (see docs/BACKLOG.md issue #69).
	# StartDelayTicks is also pushed out past the stock 7500: the Grid Broker starting to bank *earlier*
	# than every other personality meant its clock ran before an opponent had an army to contest it with.
	GridReserveBotModule@gridbroker:
		RequiresCondition: enable-gridbroker-ai
		VaultTypes: silo
		EnemyBankingCondition: enemy-banking
		CoveragePercent: 125
		ContestedCoveragePercent: 150
		StartDelayTicks: 9000
		ExpandAtFillPercent: 65
		BuildIntervalTicks: 150
		AbandonBankingOnEnemyLockdown: false
	# Easy Grid Broker economy: banks late, one Vault at a time, and concedes an opponent's Lockdown
	# instead of racing it. Its Reserve win is meant to be a clock a player can beat by pressuring the
	# base, not a race they have to win on income.
	GridReserveBotModule@easygridbroker:
		RequiresCondition: enable-easygridbroker-ai
		VaultTypes: silo
		CoveragePercent: 110
		ContestedCoveragePercent: 110
		# StartDelayTicks pushed out further still (15000->18000) for issue #85: see the comment on
		# BaseBuilderBotModule@easygridbroker's weap BuildingDelays above.
		StartDelayTicks: 18000
		ExpandAtFillPercent: 95
		BuildIntervalTicks: 400
		AbandonBankingOnEnemyLockdown: true
	# Saboteur economy (issue #135, reworked): banks toward the Reserve target exactly like the Grid
	# Broker above - the same coverage, start delay, fill threshold and pace, and it races an opponent's
	# Lockdown rather than conceding it - because winning on the Reserve is now its plan. It does not
	# grant enemy-banking: the Saboteur answers an opponent's banking with Spies, not with Vault raids,
	# and only goes for Vaults in the push. EnemyLockdownCondition is the first consumer of that hook:
	# an opponent in Lockdown is about to win, so it calls the push.
	GridReserveBotModule@saboteur:
		RequiresCondition: enable-saboteur-ai
		VaultTypes: silo
		EnemyLockdownCondition: enemy-lockdown
		CoveragePercent: 125
		ContestedCoveragePercent: 150
		StartDelayTicks: 9000
		ExpandAtFillPercent: 65
		BuildIntervalTicks: 150
		AbandonBankingOnEnemyLockdown: false
	# The Saboteur's Spies (issue #135, OpenRA.Mods.Sungrid/BotModules/SpyBotModule.cs). Every 90s,
	# from 5 minutes in, up to two idle infiltrators are each given the enemy building that costs least
	# to reach: distance, less the target's priority below (in cells), plus 8 cells for every defence or
	# dog within 6 cells of it (dogs see through a disguise), less up to 12 cells for distance from the
	# expected diversion point. Spies disguise as an infantryman of the target's owner first. Power
	# producers of a player already blacked out are skipped. saboteur-diversion is granted at the start
	# of the run and the infiltrators leave 10s later, so the diversion is already moving.
	# Targets: the four power plants that carry InfiltrateForPowerOutage (a Spy blacks out the whole
	# grid for 20s), and the Refinery, which a Spy or a Thief robs of half its owner's cash - the
	# Thief's only target here, and a direct brake on an opponent's banking. sgrel is left out on
	# purpose: the Smart Grid Relay cannot be blacked out (issue #101). Battery Banks (`silo`) are a
	# Spy-only target while the Sun Cycle is on (SunCycleTargetPriorities): a Spy drains the bank's
	# stored charge (issue #136), so its owner browns out at night. Banks holding under 1000 charge are
	# skipped, and with the cycle off a bank holds no charge at all, so a Spy is never wasted on one.
	# Thieves stay on the Refinery: the owner kept the asymmetry (the Assembly steals, the Consortium
	# sabotages).
	SpyBotModule@saboteur:
		RequiresCondition: enable-saboteur-ai
		InfiltratorTypes: spy, spy.england, thf
		TargetPriorities:
			powr: 20
			apwr: 20
			sgwnd: 20
			sghyd: 25
			proc: 0
		SunCycleTargetPriorities:
			silo: 15
		SunCycleInfiltratorTypes: spy, spy.england
		MinimumTargetCharge: 1000
		DefenceTypes: pbox, hbox, gun, tsla, arct, sgtur, dog
		DefenceScanRadius: 6
		DefenceCost: 8
		DiversionTargetTypes: fact, weap, barr, tent, proc, rcyd, hpad, afld, afld.ukraine, sgdrn, sgdra
		DiversionSeparation: 12
		StartDelayTicks: 7500
		RunIntervalTicks: 2250
		MaximumInfiltratorsPerRun: 2
		DiversionCondition: saboteur-diversion
		DiversionLeadTicks: 250
		DiversionDurationTicks: 1500
	# The Saboteur's finisher trigger (issue #135, OpenRA.Mods.Sungrid/BotModules/EnemyGridStateBotModule.cs).
	# Grants enemy-grid-down once three power outages have been seen across its opponents (its own
	# Spies' blackouts, in practice), and from then on while any opponent is in low or critical power
	# or an outage, kept for HoldTicks (60s) after the last sighting so a single rebuilt Solar Array
	# doesn't call the push straight back off. Nothing before StartDelayTicks (4 min). Works with
	# Grid Reserve on or off: with it off, this push is how the Saboteur wins.
	EnemyGridStateBotModule@saboteur:
		RequiresCondition: enable-saboteur-ai
		EnemyGridDownCondition: enemy-grid-down
		StartDelayTicks: 6000
		HoldTicks: 1500
		MinimumOutages: 3
	# Sun Cycle (docs/BACKLOG.md issue #136). By day each bot projects the night
	# deficit of its Solar Arrays and buys Battery Banks (counted on top of its
	# Grid Reserve Vaults by GridReserveBotModule, since one building does both
	# jobs) and night-proof power; at dusk and night it claims the idle Building
	# queue for a night-proof plant before the base builder's low-power override
	# can buy a Solar Array running at 30%. sgbat does not exist: silo is the
	# Battery Bank, and it stays OUT of every PowerTypes list (it is storage, not
	# supply). No-ops entirely while the suncycle lobby option is off. All numbers
	# reasoned, not measured.
	SunCycleBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai || enable-gridbroker-ai || enable-saboteur-ai
		StorageTypes: silo
		SolarTypes: powr, apwr
		NightPowerTypes: sgwnd, sgrel, sghyd
	# The learn-the-mode opponent copes with the night, but late and small: one
	# storage bank and two night-proof plants at most, from the second night on.
	SunCycleBotModule@easygridbroker:
		RequiresCondition: enable-easygridbroker-ai
		StorageTypes: silo
		SolarTypes: powr, apwr
		NightPowerTypes: sgwnd, sgrel
		StartTick: 15000
		MaximumStorageBanks: 1
		MaximumNightPowerPlants: 2
		BuildIntervalTicks: 400
		NightIntervalTicks: 50
