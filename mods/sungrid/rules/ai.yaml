	# The Grid Broker attacks on a smaller force than the Normal AI it otherwise copies. Banking is a
	# commitment of income that could have been army, so an opponent left completely unpressured just
	# out-banks it - the raid is what buys the time its own Reserve needs.
	SquadManagerBotModule@gridbroker:
		RequiresCondition: enable-gridbroker-ai
		SquadSize: 18
		NavalUnitsTypes: ss, msub, dd, ca, lst, pt
		ExcludeFromSquadsTypes: harv, sghau, mcv, dog, badr.bomber, u2
		ConstructionYardTypes: fact
		NavalProductionTypes: spen, syrd
		AirUnitsTypes: mig, yak, heli, hind, mh60, sgdro, sgdrs
		AircraftTargetType: AirborneActor
		ProtectionTypes: harv, mcv, mslo, gap, spen, syrd, iron, pdox, tsla, agun, dome, pbox, hbox, gun, sam, atek, weap, fact, proc, silo, hpad, afld, afld.ukraine, powr, apwr, stek, barr, kenn, tent, fix, fpwr, tenf, syrf, spef, weaf, domf, fixf, fapw, atef, pdof, mslf, facf, arct, rcyd, sgcry, sgdai, sgdrn, sgdra, sgtur, sgwnd, sghyd, sgrel, sgsns, sgshl
		IgnoredEnemyTargetTypes: AirborneActor
		ProtectUnitScanRadius: 15
		ProtectionScanRadius: 12
	# Easy Grid Broker attacks. SquadSizeRandomBonus is zeroed rather than left at the stock 30, so the
	# attack force is a flat, predictable size instead of the Grid Broker's 18-48 - a defender can learn
	# what a push looks like. With one war factory feeding it, gathering a squad takes long enough that
	# attacks arrive as occasional pushes rather than constant pressure, and MinimumAttackForceDelay
	# guarantees a rebuilding gap after each one.
	# SquadSize 25->16 and MinimumAttackForceDelay 1500->2500 for issue #82: at 25 (against a ~43-unit
	# army cap) almost every unit this bot owned left with each push, which overwhelmed a player still
	# finishing their own first production queue rather than reading as a learnable, survivable attack.
	SquadManagerBotModule@easygridbroker:
		RequiresCondition: enable-easygridbroker-ai
		SquadSize: 16
		SquadSizeRandomBonus: 0
		MinimumAttackForceDelay: 2500
		NavalUnitsTypes: ss, msub, dd, ca, lst, pt
		ExcludeFromSquadsTypes: harv, sghau, mcv, dog, badr.bomber, u2
		ConstructionYardTypes: fact
