	# Grid Reserve participation. Without this the only thing that ever builds a bot a Vault is the
	# base builder's storage-overflow path (SiloTypes above), which triggers on full ore storage and
	# has nothing to do with the Reserve target - so a bot tops out one or two Vaults short of it and
	# the economic victory is effectively human-only. Every instance below no-ops entirely while the
	# gridreserve lobby checkbox is off. See docs/GAME_MODES.md.
	GridReserveBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai
		VaultTypes: silo
	# Coverage is spare *capacity* only, now that GridReserveVaultInfo.MaximumTargetPercent caps what is
	# actually banked at the Reserve target - before that ceiling existed these percentages were banked
	# in full, which bought a Lockdown no single raid could break (see docs/BACKLOG.md issue #69).
	# StartDelayTicks is also pushed out past the stock 7500: the Grid Broker starting to bank *earlier*
	# than every other personality meant its clock ran before an opponent had an army to contest it with.
	GridReserveBotModule@gridbroker:
		RequiresCondition: enable-gridbroker-ai
		VaultTypes: silo
		CoveragePercent: 125
		ContestedCoveragePercent: 150
		StartDelayTicks: 9000
		ExpandAtFillPercent: 65
		BuildIntervalTicks: 150
		AbandonBankingOnEnemyLockdown: false
	# Easy Grid Broker economy: banks late, one Vault at a time, and concedes an opponent's Lockdown
	# instead of racing it. Its Reserve win is meant to be a clock a player can beat by pressuring the
	# base, not a race they have to win on income.
	GridReserveBotModule@easygridbroker:
		RequiresCondition: enable-easygridbroker-ai
		VaultTypes: silo
		CoveragePercent: 110
		ContestedCoveragePercent: 110
		StartDelayTicks: 15000
		ExpandAtFillPercent: 95
		BuildIntervalTicks: 400
		AbandonBankingOnEnemyLockdown: true
