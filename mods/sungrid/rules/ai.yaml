	# Easy Grid Broker base. Same build order as the Normal AI, but roughly a third of the production
	# capacity (1 barracks/1 tent/1 war factory against 7/7/4) and no superweapon or advanced tech, so
	# its army is throughput-limited rather than cash-limited. Defenses are thinned out too - a base a
	# new player cannot get into is a base whose Vaults they can never raid, which is the one skill
	# this opponent exists to teach.
	BaseBuilderBotModule@easygridbroker:
		RequiresCondition: enable-easygridbroker-ai
		MinimumExcessPower: 0
		MaximumExcessPower: 120
		ExcessPowerIncrement: 40
		ExcessPowerIncreaseThreshold: 4
		# The base-building pace itself (issue #134). Every delay below only says when a building may
		# first be considered; between buildings the engine checks again after this many ticks, and
		# its default 25 (~1s) started the next building almost as soon as the last one went down.
		# 175 (~7s) adds about ten seconds a building on average - up to 7s before a finished
		# building is placed, then up to 7s before the next is queued - on top of each building's own
		# build time. Reasoned, not measured. The other personalities use 75.
		StructureProductionActiveDelay: 175
		ConstructionYardTypes: fact
		RefineryTypes: proc
		InititalMinimumRefineryCount: 0
		AdditionalMinimumRefineryCount: 1
		ExpansionTolerate: 0
		ForceExpansionTolerate: 0
		PowerTypes: powr,apwr,sgwnd,sgrel
		TechTypes: dome, fix
		ProductionTypes: barr,tent,weap
		NewProductionCashThreshold: 8000
		SiloTypes: silo
		# agun added for issue #83: sam was the only anti-air entry, and it needs the Soviet-derived
		# (Assembly) tech tree - a Consortium-side Easy Grid Broker had no anti-air structure at all,
		# leaving a handful of e3 Rocket Soldiers as its only counter to enemy aircraft and drones.
		DefenseTypes: pbox,gun,sam,agun,arct,sgtur
		BuildingLimits:
			barr: 1
			tent: 1
			dome: 1
			weap: 1
			fix: 1
			silo: 8
			rcyd: 1
			sgrel: 2
			sgsns: 1
			sgdrn: 1
			sgdra: 1
		BuildingFractions:
			powr: 1
			proc: 1
			tent: 1
			barr: 1
			dome: 1
			weap: 1
			pbox: 2
			gun: 2
			sam: 1
			agun: 1
			arct: 2
			fix: 1
			rcyd: 2
			sgwnd: 6
			sgrel: 2
			sgtur: 2
			sgsns: 1
			sgdrn: 1
			sgdra: 1
		# weap delay added for issue #82: undelayed, this bot reached its first War Factory at the same
		# pace as the Normal AI, which is what a new player was actually losing the early game to (not
		# base expansion - McvExpansionManagerBotModule@easygridbroker below never expands). Pushed out
		# further still (3000->5000) for issue #85, alongside GridReserveBotModule@easygridbroker's
		# StartDelayTicks below, after feedback that the War Factory was still arriving too soon. Pushed
		# out again (5000->7000) for issue #96 after feedback that tanks were still arriving too fast.
		# Issue #134 pushed the War Factory (7000->9000), Radar (9000->11000), Repair Bay
		# (6000->8000) and the drone bay (12000->18000) out again, alongside the slower pace above.
		BuildingDelays:
			dome: 11000
			fix: 8000
			pbox: 4000
			gun: 5000
			arct: 4000
			sgtur: 5000
			sgsns: 9000
			weap: 9000
			# One drone bay, late (issue #132): ~12 minutes in since issue #134 (it was ~8), well
			# after its War Factory, so the first air a new player meets is a pair of drones in the
			# mid game, not an opening. It still needs a Recycling Depot first, as it does for every
			# faction.
			sgdrn: 18000
			sgdra: 18000
