			tent: 1
			dome: 1
			weap: 1
			fix: 1
			silo: 8
			rcyd: 1
			sgrel: 2
			sgsns: 1
		BuildingFractions:
			powr: 1
			proc: 1
			tent: 1
			barr: 1
			dome: 1
			weap: 1
			pbox: 2
			gun: 2
