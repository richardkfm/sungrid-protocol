	# Saboteur base (issue #135, reworked). A defensive base: defences weighted above the Normal AI's,
	# with ground defences and anti-air both early, because most of its army stays home and the base has
	# to hold while the Reserve fills. Two barracks and two War Factories at most - it fields a modest
	# army - and no airfields or helipads. Radar (dome) comes early because every Spy and Thief needs it.
	# Smart Grid Relays are weighted up: the one power building no Spy can black out (issue #101), which
	# a bot that lives by blackouts would want for itself (the Consortium only; the Assembly builds
	# what it can). Reasoned, not measured.
