Player:
	# The first ModularBot is the default: the engine's SkirmishLogic adds it to a fresh skirmish, and it
	# heads every bot dropdown. Saboteur AI since the owner's call (issue #138). "Add bots" (fill every free
	# slot) stays random - LobbyLogic picks it, and changing that would need an engine patch.
	ModularBot@SaboteurAI:
		Name: bot-saboteur-ai.name
		Type: saboteur
	ModularBot@RushAI:
		Name: bot-rush-ai.name
		Type: rush
	ModularBot@NormalAI:
		Name: bot-normal-ai.name
		Type: normal
	ModularBot@TurtleAI:
		Name: bot-turtle-ai.name
		Type: turtle
	ModularBot@NavalAI:
		Name: bot-naval-ai.name
		Type: naval
	ModularBot@GridBrokerAI:
		Name: bot-grid-broker-ai.name
		Type: gridbroker
	ModularBot@EasyGridBrokerAI:
		Name: bot-easy-grid-broker-ai.name
		Type: easygridbroker
	GrantConditionOnBotOwner@rush:
		Condition: enable-rush-ai
		Bots: rush
	GrantConditionOnBotOwner@normal:
		Condition: enable-normal-ai
		Bots: normal
	GrantConditionOnBotOwner@turtle:
		Condition: enable-turtle-ai
		Bots: turtle
	GrantConditionOnBotOwner@naval:
		Condition: enable-naval-ai
		Bots: naval
	GrantConditionOnBotOwner@gridbroker:
		Condition: enable-gridbroker-ai
		Bots: gridbroker
	GrantConditionOnBotOwner@easygridbroker:
		Condition: enable-easygridbroker-ai
		Bots: easygridbroker
	GrantConditionOnBotOwner@saboteur:
		Condition: enable-saboteur-ai
		Bots: saboteur
	# The Grid Broker builds the Normal AI's base, so it reuses those modules rather than duplicating
	# their config. It has only two of its own: SquadManagerBotModule@gridbroker (attacks on a smaller
	# force) and the GridReserveBotModule@gridbroker instance at the end of this file.
	#
	# The Easy Grid Broker is the learn-the-mode opponent and does NOT reuse the Normal AI's base: a
	# Grid Reserve bot that plays the economy well is still a full-strength Normal AI in the ground war,
	# which is what actually beats a player who is new to the mode. It therefore carries its own smaller
	# base builder, unit builder and squad manager, and deliberately opts out of support powers and base
	# expansion below. See docs/GAME_MODES.md.
	#
	# The Saboteur (issue #135, reworked) plays for the economic win and slows its opponents with
	# Spies: a defensive base, a modest army that mostly stays home, Grid Reserve banking like the Grid
	# Broker, and regular infiltration runs on enemy power plants with a small diversion attack on
	# another part of the base to cover them. It shares the Normal AI's harvesters and expansion
	# (McvExpansionManagerBotModule@normal is what deploys its starting MCV - without an instance of
	# that module a personality never builds anything), and carries its own base builder, unit builder,
	# three squad managers, a GridReserveBotModule, the SpyBotModule and the EnemyGridStateBotModule.
	ResourceMapBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-gridbroker-ai || enable-easygridbroker-ai || enable-saboteur-ai
		ResourceCreatorTypes: mine, gmine
		ValuableResourceTypes: Ore, Gems
		HarvesterTypes: harv
		RefineryTypes: proc
		EnemyBaseBuildingTypes: pbox,gun,tsla,agun,barr,tent,weap,afld,hpad,fact,powr,apwr,proc,arct,sgtur,sgcry,sgdai,sgdrn,sgdra,sgwnd,sghyd,sgrel,rcyd
	SupportPowerBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai || enable-gridbroker-ai || enable-saboteur-ai
		Decisions:
			spyplane:
				OrderName: SovietSpyPlane
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
			paratroopers:
				OrderName: SovietParatroopers
				MinimumAttractiveness: 5
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 8c0
				Consideration@2:
					Against: Enemy
					Types: Water
					Attractiveness: -5
					TargetMetric: None
					CheckRadius: 8c0
			parabombs:
				OrderName: UkraineParabombs
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
			nukepower:
				OrderName: NukePowerInfoOrder
				MinimumAttractiveness: 3000
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: Value
					CheckRadius: 5c0
				Consideration@2:
					Against: Ally
					Types: Air, Ground, Water
					Attractiveness: -10
					TargetMetric: Value
					CheckRadius: 7c0
	HarvesterBotModule@rush-naval:
		RequiresCondition: enable-rush-ai || enable-naval-ai
		HarvesterTypes: harv
		RefineryTypes: proc
		InitialHarvesters: 2
	HarvesterBotModule@normal-turtle:
		RequiresCondition: enable-normal-ai || enable-turtle-ai || enable-gridbroker-ai || enable-saboteur-ai
		HarvesterTypes: harv
		RefineryTypes: proc
		InitialHarvesters: 4
	# Half the Normal AI's opening harvester fleet. Income is the root lever on this bot: it caps how
	# fast it can bank *and* how big an army it can sustain, without needing either to be nerfed directly.
	HarvesterBotModule@easygridbroker:
		RequiresCondition: enable-easygridbroker-ai
		HarvesterTypes: harv
		RefineryTypes: proc
		InitialHarvesters: 2
	# Sungrid roster support (docs/BACKLOG.md issue #77, finding T3). Until this pass every
	# BaseBuilderBotModule below listed stock RA actors only, so no bot ever built a Wind Turbine
	# Array, Hydrogen Plant, Smart Grid Relay, Recycling Depot, Cryptominer, Datacenter for AI,
	# Sensor Array, Resilience Shelter, Grid Defense Turret or either Drone Bay - the whole faction
	# power-identity pass in docs/ENERGY_BALANCE.md was human-only, and every bot match silently
	# tested the stock tech tree. It also meant the `mslo: 1` entry every personality carries was
	# dead: issue #22 made all three superweapons require `sgdai`, which no bot built, so no bot
	# could ever finish a superweapon.
	#
	# The fractions, limits and delays added below are reasoned from each personality's existing
	# numbers and each building's cost/power, NOT measured against an observed bot match - the same
	# caveat every previous AI-tuning pass in this repo carries. See docs/BACKLOG.md issue #31.
	BaseBuilderBotModule@rush:
		RequiresCondition: enable-rush-ai
		MinimumExcessPower: 0
		MaximumExcessPower: 160
		ExcessPowerIncrement: 40
		ExcessPowerIncreaseThreshold: 4
		# Ticks between base-builder checks while a building is queued or under construction. The
		# engine default 25 (~1s) meant the next building started about a second after the last
		# one went down - faster than a human plays. 75 (~3s) for issue #134; the Easy Grid Broker
		# gets much more.
		StructureProductionActiveDelay: 75
		ConstructionYardTypes: fact
		RefineryTypes: proc
		# rcyd is deliberately NOT in RefineryTypes: that list drives the ore-economy
		# adequacy check and refinery-near-resources placement, and a Recycling Depot
		# refines Scrap, not Ore. It is a normal building to this bot, via
		# BuildingFractions below. See docs/BACKLOG.md issue #77, finding T3.
		PowerTypes: powr,apwr,sgwnd,sghyd,sgrel
		ExpansionTolerate: 0
		ForceExpansionTolerate: 0
		TechTypes: mslo, dome, atek, stek, fix, sgdai
		InititalMinimumRefineryCount: 0
		AdditionalMinimumRefineryCount: 2
		ProductionTypes: barr,tent,weap
		NewProductionCashThreshold: 7000
		SiloTypes: silo
		DefenseTypes: hbox,pbox,gun,tsla,agun,sam,arct,sgtur
		BuildingLimits:
			barr: 7
			tent: 7
			kenn: 1
			dome: 1
			weap: 4
			atek: 1
			stek: 1
			fix: 1
			silo: 8
			rcyd: 1
			sgdrn: 1
			sgdra: 1
			sgdai: 1
			sgcry: 1
			sgsns: 1
			sgshl: 1
			sghyd: 2
			sgrel: 3
		BuildingFractions:
			powr: 1
			proc: 1
			barr: 3
			kenn: 1
			tent: 3
			weap: 4
			pbox: 3
			gun: 3
			tsla: 3
			gap: 1
			agun: 5
			sam: 5
			arct: 3
			atek: 1
			stek: 1
			fix: 1
			dome: 10
			mslo: 1
			rcyd: 2
			sgwnd: 8
			sghyd: 2
			sgrel: 2
			sgtur: 4
			sgdrn: 2
			sgdra: 2
			sgdai: 1
			sgcry: 2
			sgsns: 1
			sgshl: 1
		BuildingDelays:
			dome: 7000
			fix: 3000
			pbox: 2000
			gun: 3000
			tsla: 3000
			arct: 2000
			kenn: 9000
			atek: 11000
			stek: 11000
			sgtur: 3000
			# 4000->3000 for issue #132, alongside the engine fix that lets a drone squad actually
			# launch: the Drone Bay also waits on a Recycling Depot, so its delay is not the only gate.
			sgdrn: 3000
			sgdra: 3000
			sgcry: 12000
			sgdai: 12000
			sgsns: 8000
			sgshl: 13000
