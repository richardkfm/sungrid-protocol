	MissionObjectives:
		WinNotification: Win
		LoseNotification: Lose
		LeaveNotification: Leave
		# EarlyGameOver stays off (the engine default). It was on until issue #141 so a Grid
		# Reserve win would resolve the other players, but the engine also applies it to every
		# defeat: the first player eliminated in a 3+ player free-for-all made every survivor the
		# winner and ended the match. GridReserveController now defeats the Lockdown winner's
		# opponents itself, and destruction victory ends the normal way, with the last side standing.
	ConquestVictoryConditions:
	GridReserveManager:
	# Caps the Battery Banks a player may own while Grid Reserve is on: as many as
	# the Reserve target needs, plus four (issue #147). Two players with the Sun
	# Cycle on: 8 + 4 = 12. Provides the `bankslot` prerequisite SILO asks for.
	GridReserveBankLimit:
		BankTypes: silo
		Prerequisite: bankslot
	PowerManager:
		SpeechNotification: LowPower
		TextNotification: notification-low-power
	# Sun Cycle storage: moves surplus power into Battery Banks and back out
	# once a second. Idle unless the suncycle lobby option is on (issue #136).
	PowerStorageManager:
	# PowerManager only notifies power-state listeners when excess power changes
	# sign, so Low -> Critical went unannounced and the drones'
	# `ValidPowerStates: Critical` disarm went stale. Every Sun Cycle night walks
	# a solar grid through exactly that step, so this re-notifies on every
	# PowerState change. Active whether or not the cycle is on (issue #136).
	PowerStateChangeNotifier:
